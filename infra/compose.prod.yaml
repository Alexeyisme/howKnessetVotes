# Production stack on the Hetzner server (docs/deploy.md). Run through scripts/prod.sh, which passes /srv/hkv/.env:
#   POSTGRES_PASSWORD=...   SITE_DOMAIN=knessetvotes.org
name: hkv

x-db-url: &db-url postgresql://knesset:${POSTGRES_PASSWORD:?set in .env}@db:5432/knesset

# the Next.js server, run twice (web, web-2); only `web` builds the image
x-web: &web
  image: hkv-web
  restart: unless-stopped
  environment:
    HKV_API_URL: http://api:8000
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}       # read at request time by the /suggest page
    UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}           # page-view counting (umami below); off when empty
  depends_on:
    api: { condition: service_healthy }

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: knesset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knesset
    # sized for the 8 GB server (CPX32) shared with the API and web processes
    command: postgres -c shared_buffers=1GB -c effective_cache_size=4GB -c work_mem=16MB -c maintenance_work_mem=512MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knesset"]
      interval: 5s
      retries: 30

  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    image: hkv-api
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      # corrections and mistake reports are forwarded to the owner's chat by @knessetvotes_bot (api/suggestions.py)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}   # Cloudflare Turnstile check of the contact form; off when empty
      HKV_IP_SALT: ${HKV_IP_SALT:-}                     # salt of the contact form's per-visitor hash (openssl rand -hex 32)
    # one worker per vCPU; --limit-concurrency: past 48 open requests per worker, answer 503 at once. Without it an overload queued work for
    # minutes after the traffic had gone, and the site stayed down (load tests, docs/deploy.md#capacity)
    command: sh -c "python db/migrate.py && exec uvicorn hkv.api.app:app --host 0.0.0.0 --port 8000 --workers 4 --limit-concurrency 48 --proxy-headers --forwarded-allow-ips '*'"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status', timeout=5)"]
      interval: 30s
      start_period: 30s

  # Two Next.js processes, one per vCPU (a Node process renders on one core), behind the HTML micro-cache below
  web:
    <<: *web
    build: ../apps/web

  web-2:
    <<: *web

  # HTML micro-cache in front of web and web-2 (infra/nginx-cache.conf); Caddy sends page requests here
  cache:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx-cache.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:size=600m
    depends_on: [web, web-2]

  # Page-view statistics for the owner (roadmap O6): cookie-free, no personal data kept. Its tables live in a separate
  # `umami` database of the same Postgres (created once, docs/deploy.md). The dashboard is stats.{SITE_DOMAIN}; the
  # site loads the tracker and sends page views through knessetvotes.org/u/ (Caddyfile).
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://knesset:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      CLIENT_IP_HEADER: x-real-ip      # set by Caddy from CF-Connecting-IP; used only for the daily visitor hash
      DISABLE_TELEMETRY: 1
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [cache, api, umami]

  # scheduled job, started by the hkv-update systemd timer: scripts/prod.sh run --rm updater
  updater:
    image: hkv-api
    profiles: [jobs]
    environment:
      DATABASE_URL: *db-url
      # title translations (hkv translate / inside hkv update); empty = skipped
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HKV_TRANSLATE_LANGS: ${HKV_TRANSLATE_LANGS:-en,ru,ar}
      HKV_TRANSLATE_MODEL: ${HKV_TRANSLATE_MODEL:-claude-haiku-4-5-20251001}
      # HTTP proxy for knesset.gov.il only (the Knesset refuses requests from outside Israel); empty = direct
      HKV_KNESSET_PROXY: ${HKV_KNESSET_PROXY:-}
    volumes:
      - raw:/data/raw
    command: hkv update --days 30 --log -
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  raw:
  caddy_data:
  caddy_config:

# Micro-cache for the site's HTML between Caddy and the Next.js servers (infra/compose.prod.yaml).
# Every page is rendered at request time and Next.js marks it uncacheable; one render per page per minute is enough for
# data that changes a few times a day. Concurrent requests for the same page wait for one render, and a stale page is
# served while it is being refreshed. Next.js runs as two processes (one per vCPU): a single Node process renders on
# one core only. The load tests behind these settings: docs/deploy.md, section Capacity.

upstream next {
    least_conn;
    # never mark a server down: a slow render is overload, and with both marked down nginx answers 502 to everyone
    server web:3000 max_fails=0;
    server web-2:3000 max_fails=0;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:20m max_size=512m inactive=1h use_temp_path=off;

# the correction form (one URL per translated title) is not worth a cache entry
map $uri $no_cache {
    default 0;
    "~^/[a-z]{2}/suggest" 1;
}

server {
    listen 8080;
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Caddy compresses the response for the visitor; gzip in Node would cost CPU on the process that renders
    proxy_set_header Accept-Encoding "";
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_read_timeout 30s;
    # try the other server only when one is unreachable; retrying a timed-out render doubles the load that caused it
    proxy_next_upstream error;

    # localized pages: /ru, /en/votes/123, ...
    location ~ ^/(ru|en|he|ar)(/|$) {
        proxy_pass http://next;
        proxy_cache html;
        # Next.js answers a page and its client-side navigation data (RSC) on the same path; these headers tell them apart
        proxy_cache_key "$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_state_tree|$http_next_router_segment_prefetch|$http_next_url";
        # Next.js sends "private, no-store" and Vary on its RSC headers (in the key above); a response that sets a
        # cookie is still never cached (Set-Cookie is not ignored)
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid 200 301 302 308 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
    }

    # everything else (redirects of unprefixed paths, which depend on the visitor's cookie and language; static files)
    location / {
        proxy_pass http://next;
    }
}

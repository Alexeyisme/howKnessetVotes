# Faction names in Russian, English and Arabic, keyed by Knesset faction ID (KNS_Faction.Id).
# Loaded by `hkv names` with origin 'curated'. For the current Knesset, official names from the Knesset
# website are stored too and take precedence; `*_short` stays from here.
# ru/en = the name as a reader would know it (full list name only when it matters); *_short = for tables and charts.
# he_short = a short Hebrew name where the official one is a long list name (the full Hebrew name is always official).
# Conventions: Russian names as used in Israeli Russian-language media; English as on the Knesset website; Arabic as
# on the Knesset website's Arabic pages and in Israeli Arabic-language media (Hadash = الجبهة, Ra'am = الموحدة, Balad = التجمع).


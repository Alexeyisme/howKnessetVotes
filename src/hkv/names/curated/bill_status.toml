# The Knesset's bill statuses (KNS_Status; 23 values on bills with a plenum vote) in the site's languages. The Hebrew
# label is the official text and the key; the translations are ours. A status that is not here is shown in Hebrew
# (`hkv status` lists such statuses). "Continuity" (דין רציפות): carrying a bill over from the previous Knesset at
# the stage it had reached.

[status."התקבלה בקריאה שלישית"]
en = "passed third reading"
ru = "принят в третьем чтении"
ar = "أُقرّ في القراءة الثالثة"

[status."נעצרה"]
en = "stopped"
ru = "остановлен"
ar = "توقّف"

[status."מוזגה עם הצעת חוק אחרת"]

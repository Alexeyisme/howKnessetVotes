[project]
name = "hkv"
version = "0.0.1"
description = "How the Knesset votes: ingestion, API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.115",
    "pillow>=11",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[project.scripts]
hkv = "hkv.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

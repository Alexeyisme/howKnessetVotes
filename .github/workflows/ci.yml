name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: knesset
          POSTGRES_PASSWORD: knesset
          POSTGRES_DB: knesset
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U knesset" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://knesset:knesset@localhost:5433/knesset
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
